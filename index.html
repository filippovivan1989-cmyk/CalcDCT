
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор ДКТ — исправленная модель</title>
  <style>
    body { background:#0f1220; color:#e8ecff; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial; margin:0; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 12px; }
    .grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:16px; }
    .card { background:#171b2e; border:1px solid #2a2f4a; border-radius:16px; padding:16px; }
    .row { display:grid; grid-template-columns: 1fr 160px; gap:10px; align-items:center; margin:8px 0; }
    input, select { width:100%; padding:8px; border-radius:10px; border:1px solid #2a2f4a; background:#0e1326; color:#e8ecff; }
    .addon { display:flex; gap:8px; margin:6px 0; align-items:center; }
    .total { font-size:28px; color:#7aa2f7; font-weight:700; margin-bottom:12px; }
    .muted { opacity:.7; font-size:12px; }
    @media (max-width: 980px){ .grid { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Калькулятор ДКТ (исправленная логика МГП/сверхпакета)</h1>
    <p class="muted">Прайс редактируется в <code>price.json</code>. Наценка применяется только к сверхпакету.</p>
    <div class="grid">
      <div class="card">
        <h3>Входы</h3>
        <div class="row"><label>Тариф</label><select id="tariff"></select></div>
        <div class="row"><label>Время закрепления номера</label><select id="retention"></select></div>
        <div class="row"><label>Трафик (сессии)</label><input id="traffic" type="number" min="0" step="1"></div>
        <div class="row"><label>Кол-во виджетов</label><input id="widgets" type="number" min="1" step="1" value="1"></div>
        <div class="row"><label>Трафик e-mail</label><input id="email_traffic" type="number" min="0" step="1" value="0"></div>
      </div>
      <div class="card">
        <h3>Доп.услуги</h3>
        <div id="addons"></div>
      </div>
      <div class="card">
        <h3>Итог</h3>
        <div class="total" id="out_total">—</div>
        <div>Абонплата: <b id="bd_flat">—</b></div>
        <div>МГП (списывается всегда): <b id="bd_pkg">—</b></div>
        <div>Стоимость трафика по ставке: <b id="bd_raw">—</b></div>
        <div>Сверхпакет: <b id="bd_over">—</b> × наценка <b id="bd_markup">—</b> ⇒ <b id="bd_overm">—</b></div>
        <div>Виджеты и допы: <b id="bd_addons">—</b></div>
      </div>
    </div>
  </div>
  <script type="module" src="./engine.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
